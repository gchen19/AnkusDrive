name: Nightly (hosted FreeCAD)

# EXPERIMENTAL / UNVERIFIED as of first commit.
#
# A stock GitHub-hosted (ubuntu) fallback that installs FreeCAD from conda-forge
# and runs the FreeCAD-side worker tests — so CI isn't a single-point-of-failure
# on the one self-hosted FreeCAD box (test.yml). If that runner is down, this
# still proves the core builds and computes on a clean machine.
#
# It is scheduled nightly AND exposes workflow_dispatch so it can be triggered
# on demand to validate it (Actions tab -> "Nightly (hosted FreeCAD)" -> Run).
#
# KNOWN RISKS this has NOT been validated against (watch the first run):
#   1. FreeCAD VERSION. tests/test_worker.py asserts the worker reports 1.1.x
#      (major.minor) AND runs under Python 3.11. Verified 2026-06-03: conda-forge
#      ships `freecad 1.1.0` with a linux-64 / py3.11 build, so installing
#      `freecad>=1.1,<1.2` into this py3.11 env satisfies both asserts. The pin is
#      bounded `<1.2` (no unversioned fallback) so that a future minor can't
#      silently install and fail the version assert with a confusing message —
#      an unsatisfiable solve will surface as a clear conda error instead.
#   2. freecadcmd RESOLUTION. ankusdrive/client.py finds the binary via
#      $ANKUSDRIVE_FREECADCMD -> shutil.which -> known paths. We export the conda
#      binary's path explicitly so resolution doesn't depend on PATH activation.
#   3. SCOPE. Runs the FreeCAD-side worker tests (test_worker + test_mating_dims)
#      plus the FreeCAD-free contracts as a baseline. The FEM subset of
#      test_worker shells out to the external CalculiX (`ccx`) solver, so we
#      install conda-forge `calculix` too (it lands as a plain `ccx` on PATH,
#      which FreeCAD 1.1's femtools.ccxtools resolves via shutil.which — no
#      preference wiring needed). The render/integration tests need Pillow and
#      the .venv two-interpreter split that run_all.sh wires up, which this
#      minimal env does not set up — they stay on the self-hosted suite.
#
# Until a green run is observed, treat a red result here as "the fallback needs
# iteration", not "the code is broken" (the self-hosted suite in test.yml is the
# source of truth).

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch: {}    # manual trigger to validate / re-run on demand

concurrency:
  group: nightly-hosted-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hosted-freecad:
    name: Worker suite on conda-forge FreeCAD (EXPERIMENTAL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env stays activated
    steps:
      - uses: actions/checkout@v5

      - name: Set up Miniforge (conda-forge)
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: ankusdrive
          python-version: "3.11"

      - name: Install FreeCAD 1.1 + CalculiX from conda-forge
        run: |
          # calculix provides the `ccx` FEM solver FreeCAD shells out to; without
          # it the test_worker FEM cases fail with "CalculiX binary not found".
          # conda-forge installs it as $CONDA_PREFIX/bin/ccx, and FreeCAD 1.1's
          # femtools.ccxtools falls back to shutil.which("ccx") when no
          # ccxBinaryPath pref is set — so PATH presence is enough.
          conda install -y "freecad>=1.1,<1.2" calculix
          echo "--- freecadcmd ---"
          which freecadcmd
          freecadcmd --version 2>&1 | head -3 || true
          echo "--- ccx (CalculiX FEM solver) ---"
          which ccx
          ccx -v 2>&1 | head -2 || true
          echo "ANKUSDRIVE_FREECADCMD=$(which freecadcmd)" >> "$GITHUB_ENV"

      # The worker suite ships on main; the contracts (#8) and mating-dims (#11)
      # files arrive when those PRs merge — run them when present, skip cleanly
      # otherwise, so this workflow is mergeable independently of PR order.
      - name: Static contracts (FreeCAD-free baseline)
        run: |
          if [ -f tests/test_contracts.py ]; then
            python tests/test_contracts.py
          else
            echo "tests/test_contracts.py not on this ref yet (merges with #8) — skipping"
          fi

      - name: Worker suite (FreeCAD-side)
        run: python tests/test_worker.py

      - name: Mating-dimension golden table
        run: |
          if [ -f tests/test_mating_dims.py ]; then
            python tests/test_mating_dims.py
          else
            echo "tests/test_mating_dims.py not on this ref yet (merges with #11) — skipping"
          fi
