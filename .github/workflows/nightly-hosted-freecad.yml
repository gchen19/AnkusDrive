name: Nightly (hosted FreeCAD)

# EXPERIMENTAL / UNVERIFIED as of first commit.
#
# A stock GitHub-hosted (ubuntu) fallback that installs FreeCAD from conda-forge
# and runs the FreeCAD-side worker tests — so CI isn't a single-point-of-failure
# on the one self-hosted FreeCAD box (test.yml). If that runner is down, this
# still proves the core builds and computes on a clean machine.
#
# It is scheduled nightly AND exposes workflow_dispatch so it can be triggered
# on demand to validate it (Actions tab -> "Nightly (hosted FreeCAD)" -> Run).
#
# KNOWN RISKS this has NOT been validated against (watch the first run):
#   1. FreeCAD VERSION. tests/test_worker.py asserts the worker reports 1.1.x.
#      conda-forge's `freecad` may resolve to a different minor (e.g. 1.0.x),
#      which would fail those version asserts. We pin `freecad=1.1.*` first and
#      only fall back to the newest available if the solver can't satisfy it.
#   2. freecadcmd RESOLUTION. driftpin/client.py finds the binary via
#      $DRIFTPIN_FREECADCMD -> shutil.which -> known paths. We export the conda
#      binary's path explicitly so resolution doesn't depend on PATH activation.
#   3. SCOPE. Only the FreeCAD-side worker tests run here (test_worker +
#      test_mating_dims), plus the FreeCAD-free contracts as a baseline. The
#      render/integration tests need Pillow and the .venv two-interpreter split
#      that run_all.sh wires up, which this minimal env does not set up — they
#      stay on the self-hosted suite.
#
# Until a green run is observed, treat a red result here as "the fallback needs
# iteration", not "the code is broken" (the self-hosted suite in test.yml is the
# source of truth).

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch: {}    # manual trigger to validate / re-run on demand

concurrency:
  group: nightly-hosted-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hosted-freecad:
    name: Worker suite on conda-forge FreeCAD (EXPERIMENTAL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env stays activated
    steps:
      - uses: actions/checkout@v5

      - name: Set up Miniforge (conda-forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: driftpin
          python-version: "3.11"

      - name: Install FreeCAD 1.1 from conda-forge
        run: |
          conda install -y "freecad=1.1.*" || conda install -y freecad
          echo "--- freecadcmd ---"
          which freecadcmd
          freecadcmd --version 2>&1 | head -3 || true
          echo "DRIFTPIN_FREECADCMD=$(which freecadcmd)" >> "$GITHUB_ENV"

      # The worker suite ships on main; the contracts (#8) and mating-dims (#11)
      # files arrive when those PRs merge — run them when present, skip cleanly
      # otherwise, so this workflow is mergeable independently of PR order.
      - name: Static contracts (FreeCAD-free baseline)
        run: |
          if [ -f tests/test_contracts.py ]; then
            python tests/test_contracts.py
          else
            echo "tests/test_contracts.py not on this ref yet (merges with #8) — skipping"
          fi

      - name: Worker suite (FreeCAD-side)
        run: python tests/test_worker.py

      - name: Mating-dimension golden table
        run: |
          if [ -f tests/test_mating_dims.py ]; then
            python tests/test_mating_dims.py
          else
            echo "tests/test_mating_dims.py not on this ref yet (merges with #11) — skipping"
          fi
