name: Heavy solver regressions (self-hosted)

# The CPU-intensive LIVE external-solver test cases — OpenFOAM CFD/molding,
# standalone Elmer (CHT / transient thermal / radiation / acoustic / harmonic /
# EM), openEMS FDTD, Bempp BEM, YADE DEM, preCICE↔CalculiX FSI, CalculiX warpage
# — are EXCLUDED from the per-push suite (test.yml). On the self-hosted box every
# one of those solvers is installed, so they used to run on every push; several
# take minutes, a few are flaky under load, and run_all.sh's `set -e` means one
# slow/flaky live solve could blow the 20-minute cap or abort the rest of the
# suite. The cheap analytic-oracle / case-structure halves still run every push.
#
# This workflow runs the full suite WITH the live solves enabled
# (RUN_HEAVY_SOLVES=1) only when it's actually needed to confirm a change hasn't
# regressed a solver:
#   - a push to main whose paths touch solver / analysis code (the filter below)
#     — i.e. post-merge regression validation; a docs or unrelated change never
#     triggers it;
#   - on demand (workflow_dispatch) — e.g. to validate a solver PR pre-merge;
#   - nightly, as a slow-drift guard against solver / host changes.
#
# Deliberately NOT on `pull_request`: these live solves are minutes-long and a
# couple are flaky under load, so gating PRs on them would re-introduce exactly
# the merge-blocking flakiness this split removes. PRs run the fast per-push
# suite (test.yml); the heavy regression runs land on main + nightly, and a dev
# touching a solver can dispatch this workflow on their branch on demand.
#
# The gate is RUN_HEAVY_SOLVES, read via tests/heavy_solve.py: unset (the default
# in test.yml) every live solve skips even where the solver is installed; set
# they run. Same self-hosted FreeCAD box as test.yml.
#
# TWO LANES (issue #220). The Linux job runs the whole suite. A second job runs on a
# self-hosted Apple-Silicon box and covers only what is macOS-SPECIFIC and therefore
# invisible to the Linux lane: the Darwin substrate routing (bash_argv ->
# `multipass exec`), the LIVE preCICE FSI solve executed inside the Multipass VM, and
# the LIVE SU2 solve through Rosetta 2 (issue #193 / #189 — both were verified by hand
# and gated by nothing until now). The two jobs are independent: neither `needs` the
# other, so a down Multipass VM never blocks the Linux regression report and a Linux
# solver regression is still reported when the Mac is offline.

on:
  push:
    branches:
      - main
    paths:
      - "ankusdrive/analysis/**"
      - "ankusdrive/solvers.py"
      - "ankusdrive/jobs.py"
      - "tools/**"
      - "scripts/install-solvers.sh"
      - "scripts/ci-macos-preflight.sh"
      - "tests/heavy_solve.py"
      - "tests/run_macos_heavy.sh"
      - "tests/test_fsi.py"
      - "tests/test_su2_native.py"
      - "tests/test_wsl_routing.py"
      - "tests/test_em_fullwave.py"
      - "tests/test_openfoam.py"
      - "tests/test_cht.py"
      - "tests/test_acoustics_bem.py"
      - "tests/test_acoustic_fem.py"
      - "tests/test_harmonic_fem.py"
      - "tests/test_elmer.py"
      - "tests/test_em.py"
      - "tests/test_meshbridge.py"
      - "tests/test_granular.py"
      - "tests/test_warpage.py"
      - "tests/test_molding_fill.py"
      - "scripts/ci-linux-preflight.sh"
      - "scripts/ci-container-preflight.sh"
      - "tests/test_container_substrate.py"
      - "tests/test_wind_tunnel.py"
      - "tests/test_macos_relay_shim.py"
      - "tests/test_su2_case.py"
      - "tests/ci/**"
      - "scripts/ci-qemu-vm.sh"
      - "scripts/ci-vmdisk.sh"
      - ".github/workflows/heavy-solves.yml"
  workflow_dispatch:
    inputs:
      hosted_only:
        description: "Run only the GitHub-hosted lane (leave the self-hosted boxes idle)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily — slow-drift guard

# Each lane has exactly one self-hosted box, and the macOS lane's Multipass VM is
# stateful (a single shared case-dir mount), so two concurrent runs on the same ref
# would fight over it. Workflow-level, so both jobs are superseded together rather
# than queueing behind the old run.
concurrency:
  group: heavy-solves-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  heavy-solves:
    name: Live external-solver regressions (Linux, self-hosted)
    # Pin `Linux`: these live solvers (OpenFOAM/YADE/openEMS/bempp/preCICE) are Linux-only
    # and the steps are bash + AppImage. The Windows box shares the `ankusdrive` label, so
    # without this an unrelated Windows job could match. OS label is auto-applied.
    runs-on: [self-hosted, ankusdrive, Linux]
    if: ${{ !inputs.hosted_only }}
    # The full suite plus every live solve — molding (~15 min), the openEMS /
    # Bempp / FSI / Elmer / YADE solves on top. 90 min bounds a wedged solver
    # without cutting a real run.
    timeout-minutes: 90
    env:
      RUN_HEAVY_SOLVES: "1"
    steps:
      # A self-hosted job's logs go public with the repo, and tool paths under the
      # service user's home print into them (FreeCAD's Mod loader, checkout's
      # .gitconfig copy, solver discovery). Masking $HOME and the username FIRST —
      # before checkout, which is the first printer — redacts every later
      # occurrence to *** (#303).
      - name: Mask runner-local identity in logs
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::$(whoami)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wire local FreeCAD (no download; reuses installed AppImage)
        run: |
          bash tests/setup_local.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sanity check — freecadcmd reachable
        run: |
          which freecadcmd
          freecadcmd --version 2>&1 | head -1 || true

      - name: Run full suite WITH live external-solver solves
        run: bash tests/run_all.sh

  heavy-solves-hosted:
    name: Live external-solver regressions (Linux ${{ matrix.platform.arch }}, hosted image)
    # The same suite as the self-hosted job above, on GitHub-hosted runners inside the
    # prebuilt solver image (#339, docker/heavy-solvers/Dockerfile) — #340 of the move
    # off self-hosted runners (#338). Both run side by side until #342 shows this one
    # tests the same things; then the self-hosted one is removed (#343).
    #
    # Per architecture (#363): amd64, and arm64 — lane A of #341 — which is the only
    # place arm64 Linux solver builds (OpenFOAM-7 on linuxArm64, preCICE on aarch64)
    # are exercised now that the macOS VM lane is not the hosted path. The image is a
    # multi-arch manifest, so the same digest pulls each runner's platform. What an arch
    # deliberately lacks (Elmer on arm64) is reported by the preflight, not skipped silently.
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    # Unmeasured on 4 hosted cores (the self-hosted run is ~36 min on 24). Generous
    # until #342 records real timings, then tighten.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    env:
      # Digest-pinned multi-arch manifest: a rebuild of the image never changes what
      # these lanes test until this line changes. heavy-image.yml's `manifest` job
      # summary prints the digest to pin. Keep heavy-solves-container's pin in lockstep.
      HEAVY_IMAGE: ghcr.io/gchen19/ankusdrive-heavy@sha256:016d21998f6cced0db98ce33c17ff20f2512252e507f149ae87611892b8b9abb  # sha-1ccf60c, linux/amd64 + linux/arm64
    steps:
      # Not `container:` — that pulls the image before any step, leaving no chance to
      # free the runner's disk first, and this image plus the suite's case dirs need it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull solver image
        run: |
          docker pull "$HEAVY_IMAGE"
          df -h /

      # Its own step, so a missing solver is attributed here — by name — instead of
      # surfacing as a green suite full of SKIPs.
      - name: Preflight — every heavy solver resolves
        run: bash scripts/ci-heavy-docker.sh bash scripts/ci-linux-preflight.sh

      - name: Run full suite WITH live external-solver solves
        run: bash scripts/ci-heavy-docker.sh bash tests/run_all.sh

  heavy-solves-container:
    name: Container-substrate regressions (hosted Linux, solvers in a sidecar)
    # Lane B of #341 (#362). The RELAY half of what the macOS VM lane verifies, with real
    # solves: the test process runs on the runner HOST with ANKUSDRIVE_SUBSTRATE=container
    # (#361), and every OpenFOAM-backed solve crosses `docker exec` into a sidecar built
    # from the same pinned image — opaque in-container paths, the case dir at the same
    # absolute path, no stdin, pidfile stop. The host has FreeCAD but deliberately NO
    # OpenFOAM, so a solve that bypassed the relay fails instead of passing; the
    # preflight asserts that, and every other way this lane could pass while proving
    # nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      RUN_HEAVY_SOLVES: "1"
      ANKUSDRIVE_SUBSTRATE: container
      # keep in lockstep with heavy-solves-hosted's pin
      HEAVY_IMAGE: ghcr.io/gchen19/ankusdrive-heavy@sha256:016d21998f6cced0db98ce33c17ff20f2512252e507f149ae87611892b8b9abb  # sha-1ccf60c, linux/amd64 + linux/arm64
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env stays activated
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The HOST: FreeCAD + the driver deps, exactly test.yml's provisioning — which
      # carries no OpenFOAM, as this lane requires.
      - name: Set up Miniforge (conda-forge)
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: ankusdrive
          python-version: "3.11"

      - name: Install host FreeCAD 1.1 + CalculiX + suite deps
        run: |
          conda install -y "freecad>=1.1,<1.2" calculix
          python -m pip install -e .
          echo "ANKUSDRIVE_FREECADCMD=$(which freecadcmd)" >> "$GITHUB_ENV"

      # The SIDECAR: long-running, the host scratch bind-mounted at the same path, and
      # the runner's uid so container-written case files stay deletable by the host.
      # Only the SUBSTRATE solvers' in-container paths cross to the host env — the
      # image's other ANKUSDRIVE_* values (YADE, Bempp, FreeCAD, ...) name container
      # paths the host must never try to run.
      - name: Start the solver container
        run: |
          scratch="$RUNNER_TEMP/scratch"
          mkdir -p "$scratch"
          echo "TMPDIR=$scratch" >> "$GITHUB_ENV"
          docker pull "$HEAVY_IMAGE"
          docker run -d --name ankusdrive-solvers --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -v "$scratch:$scratch" "$HEAVY_IMAGE" sleep infinity
          docker exec ankusdrive-solvers env \
            | grep -E '^ANKUSDRIVE_(OPENFOAM_PATH|OPENFOAM_BASHRC|FSI_OPENFOAM_BASHRC|CCX_PRECICE|PRECICE_LIB|OPENFOAM_ADAPTER_LIB|OPENINJMOLDSIM|OPENINJMOLDSIM_BASHRC)=' \
            | tee -a "$GITHUB_ENV"

      - name: Preflight — the relay is real
        run: bash scripts/ci-container-preflight.sh

      # The macOS VM lane's files, plus the substrate contracts. run_macos_heavy.sh is
      # just the "run every file, fail if any did" loop here; its macOS preflight is
      # skipped because the container preflight above already ran.
      - name: Live solves through the container substrate
        env:
          ANKUSDRIVE_SKIP_PREFLIGHT: "1"
        run: >-
          bash tests/run_macos_heavy.sh
          tests/test_container_substrate.py tests/test_fsi.py tests/test_openfoam.py
          tests/test_meshbridge.py tests/test_wind_tunnel.py tests/test_molding_fill.py

      - name: Container logs on failure
        if: failure()
        run: docker logs --tail 200 ankusdrive-solvers || true

  heavy-solves-macos-hosted:
    name: macOS host regressions — SU2/Rosetta + Multipass relay via shim (hosted)
    # Lane C of #341 (#364). What the macOS lane checks that genuinely needs a Mac, and
    # needs no VM — so it runs on a hosted Apple-Silicon runner, which cannot run
    # Multipass (no nested virtualization):
    #   * SU2's official x86_64 macOS binary under Rosetta 2 (live solve);
    #   * the Darwin routing contracts;
    #   * the REAL macOS Multipass code path — bash_argv, multipass_vm_state,
    #     run_coupled_fsi, _stop_participant — driven unmodified against
    #     tests/ci/multipass, a stand-in CLI that rejects what a real VM breaks on
    #     (attached stdin, a case dir outside the mount, a relay whose death kills the
    #     solver) from the runner's real /var/folders TMPDIR.
    # The live in-VM solves themselves are covered by lanes A/B and the hosted image
    # lane; the Multipass daemon itself is #365's question.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUN_HEAVY_SOLVES: "1"
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env stays activated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # FreeCAD on the host: test_su2_case's channel gates drive the real worker. Same
      # conda-forge pin as the Linux lanes, so every lane tests one FreeCAD line.
      - name: Set up Miniforge (conda-forge)
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: ankusdrive
          python-version: "3.11"

      - name: Install FreeCAD 1.1 + AnkusDrive
        run: |
          conda install -y "freecad>=1.1,<1.2"
          python -m pip install -e .
          echo "ANKUSDRIVE_FREECADCMD=$(which freecadcmd)" >> "$GITHUB_ENV"
          freecadcmd --version 2>&1 | head -1 || true

      # SU2's official macOS build is x86_64. Provision Rosetta if the image lacks it,
      # then prove translation actually runs before anything depends on it.
      - name: Rosetta 2
        run: |
          if /usr/bin/pgrep -q oahd; then
            echo "Rosetta 2 already running"
          else
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true && echo "x86_64 translation works"

      - name: Install SU2 (official macOS binary, auto-discovered)
        run: bash scripts/install-solvers.sh su2

      - name: Preflight — Rosetta + SU2 resolve
        run: bash scripts/ci-macos-preflight.sh --su2

      - name: Host-side macOS regressions
        env:
          ANKUSDRIVE_SKIP_PREFLIGHT: "1"   # the --su2 preflight above already ran
        run: >-
          bash tests/run_macos_heavy.sh
          tests/test_wsl_routing.py tests/test_su2_native.py tests/test_su2_case.py
          tests/test_macos_relay_shim.py

  heavy-vmdisk:
    name: arm64 solver image -> VM disk (for lane D)
    # Lane D (#365) runs the solvers in a real Linux VM on a hosted Mac. The VM's solver
    # root is the arm64 half of the same pinned ankusdrive-heavy manifest the other
    # lanes use, exported to an ext4 disk by scripts/ci-vmdisk.sh.
    # The disk is a pure function of the pin and that script, so it is cached under both
    # (#385): a run with an unchanged pin only looks the key up (~seconds) instead of the
    # ~10 min export, and lane D restores it directly, with no artifact round trip.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      # keep in lockstep with heavy-solves-hosted's pin
      HEAVY_IMAGE: ghcr.io/gchen19/ankusdrive-heavy@sha256:016d21998f6cced0db98ce33c17ff20f2512252e507f149ae87611892b8b9abb  # sha-1ccf60c, linux/amd64 + linux/arm64
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache key (image digest + disk recipe)
        id: key
        run: echo "key=heavy-arm64-vmdisk-${{ hashFiles('scripts/ci-vmdisk.sh') }}-${HEAVY_IMAGE##*@sha256:}" >> "$GITHUB_OUTPUT"
      - name: Look up the cached disk
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vmdisk/heavy.qcow2
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
          enableCrossOsArchive: true
      - name: Free disk space
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export the arm64 rootfs + image env into an ext4 qcow2
        if: steps.lookup.outputs.cache-hit != 'true'
        run: bash scripts/ci-vmdisk.sh .vmdisk/heavy.qcow2
      # enableCrossOsArchive: saved on Linux, restored on macOS.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          path: .vmdisk/heavy.qcow2
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

  heavy-solves-macos-vm:
    name: macOS Multipass path into a real Linux VM — live solves under emulation (hosted)
    # Lane D of #341 (#365). Hosted Apple-Silicon runners cannot run Multipass (no nested
    # virtualization), but they can run QEMU's pure software emulation: this boots a real
    # arm64 Linux VM with the solver stack (scripts/ci-qemu-vm.sh) and drives it through
    # the UNMODIFIED macOS code — bash_argv -> `multipass exec` — via tests/ci/multipass
    # in its SSH/chroot mode, over a real virtio-9p mount at the same absolute path.
    # The real macOS lane's own preflight (ci-macos-preflight.sh --fsi) gates it.
    # Measured in the #365 trial: live solves ~8x native, results identical to 6-7
    # significant figures, 9p clean over 10 runs. What this still does not exercise is
    # Multipass's own daemon and its sshfs mount.
    needs: heavy-vmdisk
    runs-on: macos-latest
    # Measured under emulation (#365, then 34804804619): test_fsi ~1 min, test_openfoam
    # 54-82 min (~12-19x native), test_meshbridge 18-21 min (~23-27x), plus ~5-15 min of
    # disk restore (cached, #385) + VM boot + preflight. test_wind_tunnel (97 s native, snappyHexMesh +
    # RANS) is not yet measured here; 240 leaves it ~2x its ~12-27x estimate.
    timeout-minutes: 240
    env:
      RUN_HEAVY_SOLVES: "1"
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env stays activated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # FreeCAD on the host, as lane C: test_wind_tunnel drives cfd_external_flow_submit
      # through the real worker (the solves cross into the VM; the geometry does not).
      # Same conda-forge pin as every other lane.
      - name: Set up Miniforge (conda-forge)
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: ankusdrive
          python-version: "3.11"

      - name: Install FreeCAD 1.1 + AnkusDrive (host side)
        run: |
          conda install -y "freecad>=1.1,<1.2"
          python -m pip install -e .
          echo "ANKUSDRIVE_FREECADCMD=$(which freecadcmd)" >> "$GITHUB_ENV"
          freecadcmd --version 2>&1 | head -1 || true

      - name: Restore the solver disk (cached by heavy-vmdisk, #385)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vmdisk/heavy.qcow2
          key: ${{ needs.heavy-vmdisk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Boot the solver VM (QEMU TCG, 9p scratch, chroot)
        env:
          HEAVY_DISK: ${{ github.workspace }}/.vmdisk/heavy.qcow2
        run: |
          bash scripts/ci-qemu-vm.sh
          echo "$GITHUB_WORKSPACE/tests/ci" >> "$GITHUB_PATH"   # `multipass` -> the VM

      - name: Preflight — the real macOS lane's substrate checks, against the VM
        run: bash scripts/ci-macos-preflight.sh --fsi

      # test_molding_fill is deliberately NOT here: under emulation it ran past 3 hours
      # (interFoam + openInjMoldSim are ~15 min native). Its solves run live on lanes A/B
      # and the hosted image lane, and its relay path is the one test_openfoam and
      # test_meshbridge already drive through this VM (#386).
      # test_wind_tunnel IS here although test_meshbridge already crosses the same relay:
      # it is the one file driving cfd_external_flow_submit's job registry end to end
      # through the macOS path, which the self-hosted Mac job covered (#342).
      - name: Live solves through the macOS Multipass path
        env:
          ANKUSDRIVE_SKIP_PREFLIGHT: "1"   # ran as its own step above
        run: >-
          bash tests/run_macos_heavy.sh
          tests/test_fsi.py tests/test_openfoam.py tests/test_meshbridge.py
          tests/test_wind_tunnel.py

      - name: VM console on failure
        if: failure()
        run: tail -80 "$RUNNER_TEMP/vm/console.log" || true

  heavy-solves-macos:
    name: macOS substrate regressions — SU2/Rosetta + FSI/Multipass (self-hosted)
    # Pin `macOS`: the Linux and Windows self-hosted boxes share the `ankusdrive` label,
    # and this job's substrate (Multipass, Rosetta) exists only on the Mac. The OS
    # label is auto-applied by the Actions runner.
    runs-on: [self-hosted, ankusdrive, macOS]
    if: ${{ !inputs.hosted_only }}
    # Far short of the Linux lane's 90: this is three files, not the whole suite —
    # measured ~10s of solve on the reference box (FSI 8.9s for four preCICE windows,
    # SU2 0.2s). The budget is almost entirely headroom for a WEDGED VM, where
    # `multipass exec` blocks instead of failing; 30 min bounds that without any risk
    # of cutting a real run.
    timeout-minutes: 30
    env:
      RUN_HEAVY_SOLVES: "1"
      # The FSI stack lives INSIDE the Multipass VM, so the four ANKUSDRIVE_* overrides
      # and TMPDIR are absolute paths on that specific box — they come from the
      # runner's own environment (~/actions-runner/.env), NOT from this file. The
      # preflight step below fails with the exact `.env` lines when they are missing;
      # docs/MACOS.md ("Self-hosted CI runner") has the setup.
      ANKUSDRIVE_SKIP_PREFLIGHT: "1"   # the preflight is its own step, below
    steps:
      # A self-hosted job's logs go public with the repo, and tool paths under the
      # service user's home print into them (FreeCAD's Mod loader, checkout's
      # .gitconfig copy, solver discovery). Masking $HOME and the username FIRST —
      # before checkout, which is the first printer — redacts every later
      # occurrence to *** (#303).
      - name: Mask runner-local identity in logs
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::$(whoami)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail here, not four minutes into a coupled solve. A stopped VM, a dropped
      # multipass-sshfs mount, or a stale in-VM override otherwise surfaces as an
      # OpenFOAM abort or a preCICE handshake timeout that says nothing about the
      # real cause. This also catches the silent-no-op case: if the FSI stack does
      # not resolve, test_fsi.py's live case SKIPs and the job would pass green
      # having tested nothing.
      - name: Preflight — Multipass VM, case-dir mount, in-VM stack, Rosetta + SU2
        run: bash scripts/ci-macos-preflight.sh

      - name: Live macOS heavy solves (SU2 under Rosetta, FSI in the VM)
        run: bash tests/run_macos_heavy.sh
