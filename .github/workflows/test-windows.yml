name: Tests (Windows)

# Windows counterpart of test.yml, on a GitHub-HOSTED windows-latest runner —
# converted from the self-hosted Windows box ahead of the public flip (#303),
# for the same reasons as the Linux lane: always available, no home directory
# or keys, and fork PRs run the full suite instead of skipping it. See
# test.yml's header for the structural-security rationale.
#
# Unlike Linux there is no conda FreeCAD for Windows, so provisioning is the
# project's own user-facing paths end to end: the FreeCAD portable 7z (which
# bundles ccx.exe + gmsh.exe, so structural FEM solves for real), then
# scripts/install-solvers.ps1 for SU2 + Elmer — the exact commands
# docs/SOLVERS_WINDOWS.md gives a user, landing where ankusdrive/solvers.py
# discovers them natively. A green run here certifies the documented Windows
# install path, not just the code.
#
# The suite is tests/run_all.ps1, which skips the Linux-only external-solver
# families (OpenFOAM / YADE / openEMS / bempp / preCICE — no native Windows
# build) and runs the Windows-native FreeCAD-resolution contract
# (test_windows_support.py).
#
# A SECOND job, `core-install`, runs across a matrix of CPython versions
# (issue #279). It deliberately has no FreeCAD: its subject is the part of the
# install a fresh user hits first — "does `pip install -e .` resolve a WORKING
# dependency set on this Python, and does the MCP server then boot over
# stdio". That is exactly how #279 failed: a brand-new CPython 3.14, a
# resolver error nobody could attribute, and the MCP step never reached.

on:
  push:
    branches:
      - main
  pull_request:

# A superseded push's run is dead weight — cancel it rather than queue behind it.
concurrency:
  group: tests-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-windows:
    name: Test suite (hosted Windows, FreeCAD 1.1)
    runs-on: windows-latest
    # FreeCAD portable is a 418 MB download + 7z extraction and the SU2/Elmer
    # zips add ~200 MB more, so provisioning is the long pole (~6-8 min); the
    # suite itself is a few minutes. 45 bounds a wedged freecadcmd.exe worker
    # without cutting a slow-mirror day.
    timeout-minutes: 45
    defaults:
      run:
        # Windows PowerShell 5.1: the repo's scripts must stay 5.1-compatible
        # because that is what a stock Windows box has. (The hosted image also
        # carries pwsh; the solver installer step uses it, as its docs do.)
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: py
        with:
          python-version: "3.13"

      - name: Install FreeCAD 1.1 portable (bundles ccx.exe + gmsh.exe)
        run: |
          # The portable 7z, not the installer: no elevation, no shortcuts, and
          # the same payload — including the bundled CalculiX + gmsh the FEM
          # solves shell out to. Discovery is by $env:ANKUSDRIVE_FREECADCMD, the
          # first thing ankusdrive/client.py checks, so no PATH edits either.
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Windows-x86_64-py311.7z'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\freecad.7z"
          & 'C:\Program Files\7-Zip\7z.exe' x "$env:RUNNER_TEMP\freecad.7z" "-o$env:RUNNER_TEMP\FreeCAD" -y | Select-Object -Last 2
          $cmd = Get-ChildItem "$env:RUNNER_TEMP\FreeCAD" -Recurse -Filter freecadcmd.exe | Select-Object -First 1
          if (-not $cmd) { throw 'freecadcmd.exe not found in the portable archive' }
          $ccx = Get-ChildItem "$env:RUNNER_TEMP\FreeCAD" -Recurse -Filter ccx.exe | Select-Object -First 1
          if (-not $ccx) { Write-Warning 'no bundled ccx.exe - FEM solves will skip' }
          "ANKUSDRIVE_FREECADCMD=$($cmd.FullName)" | Add-Content $env:GITHUB_ENV

      - name: Install SU2 + Elmer via the project's own installer
        # Dogfoods scripts/install-solvers.ps1 - the exact commands
        # docs/SOLVERS_WINDOWS.md gives a user - into %LOCALAPPDATA%\AnkusDrive\
        # solvers, where ankusdrive/solvers.py probes natively. Without these the
        # SU2/Elmer solve halves would SKIP silently (#316's failure shape), and
        # heavy-solves.yml has no Windows job to catch them elsewhere.
        shell: pwsh
        run: .\scripts\install-solvers.ps1 su2 elmer

      - name: Set up venv + FreeCAD-viable deps
        env:
          ANKUSDRIVE_PY: ${{ steps.py.outputs.python-path }}
        run: .\tests\setup_local.ps1

      - name: Sanity check - ankusdrive resolves FreeCAD
        run: |
          .\.venv\Scripts\python.exe -m ankusdrive doctor --no-boot
          # doctor exits nonzero if FreeCAD is unresolved -> the run fails fast here.

      - name: Run Windows test suite
        run: .\tests\run_all.ps1

      # The user-facing installer, end to end, on a runner that HAS FreeCAD
      # (#279). Into a throwaway venv; RUNNER_TEMP is ephemeral on a hosted
      # runner, so no cleanup step is needed.
      - name: Scripted core install (scripts\install-core.ps1)
        run: >
          .\scripts\install-core.ps1
          -Python "${{ steps.py.outputs.python-path }}"
          -VenvDir "$env:RUNNER_TEMP\ankusdrive-core-venv"

  core-install:
    name: Core install (hosted Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false          # a new CPython failing must not hide the others' status
      matrix:
        # Floor (pyproject's requires-python), the current stable, and the newest
        # release — the three answers to "what is the Python ceiling?" (#279). Keep the
        # top entry in step with the newest `Programming Language :: Python :: 3.x`
        # classifier; tests/test_windows_support.py pins that classifier to
        # install-core.ps1's $PY_MAX_VERIFIED.
        python-version: ["3.10", "3.13", "3.14"]
    defaults:
      run:
        # Windows PowerShell 5.1, not pwsh: that is what a stock Windows box has, so the
        # scripts must parse there. (The hosted image has both.)
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: py
        with:
          python-version: ${{ matrix.python-version }}

      # -Python pins the matrix interpreter explicitly; the script's own auto-discovery
      # would otherwise pick whatever `py -3` resolves to on the image. No FreeCAD here,
      # so the script warns on that item and continues — but it still runs `pip install
      # -e .` with pyproject's pins, re-imports the resolved mcp/numpy/Pillow (catching a
      # #277-shaped bad resolve), and completes a real MCP stdio initialize + tools/list.
      - name: Scripted core install + MCP stdio boot
        run: >
          .\scripts\install-core.ps1
          -Python "${{ steps.py.outputs.python-path }}"
          -VenvDir "$env:RUNNER_TEMP\core-venv"

      - name: Entry point + doctor --json are well-formed without FreeCAD
        run: |
          $venv = "$env:RUNNER_TEMP\core-venv"
          # Collect the output FIRST, then test $LASTEXITCODE. Piping a native
          # command straight into `Select-Object -First N` makes PowerShell tear the
          # pipeline down as soon as N lines arrive, and the half-read process comes
          # back with a nonzero exit code -- so the pretty one-liner reports a broken
          # entry point on a `--help` that printed its usage perfectly well.
          $help = & "$venv\Scripts\ankusdrive.exe" --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'the ankusdrive.exe entry point does not run' }
          $help | Select-Object -First 3 | Write-Host
          # doctor exits nonzero here BY DESIGN (FreeCAD is unresolved on a hosted
          # runner), so gate on the report's shape, not the exit code.
          # Actions runs this shell with $ErrorActionPreference='Stop', which promotes
          # ANY native-command stderr to a terminating NativeCommandError -- and a
          # dependency deep under `mcp` (pydantic_settings) writes a warning there on
          # import, so doctor "failed" while printing perfectly good JSON. Drop to
          # 'Continue' across the call, the same guard install-core.ps1 already uses
          # around its own native invocations, and gate on the JSON as intended.
          $prevEAP = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $json = & "$venv\Scripts\python.exe" -m ankusdrive doctor --json 2>$null | Out-String
          } finally { $ErrorActionPreference = $prevEAP }
          $doctorRc = $LASTEXITCODE
          if (-not $json.Trim()) { throw 'doctor --json produced no output' }
          if ($doctorRc -eq 0) { throw 'doctor exited 0 with no FreeCAD resolved - the exit code stopped meaning anything' }
          $rep = $json | ConvertFrom-Json
          if ($rep.platform.system -ne 'Windows') { throw "doctor reports $($rep.platform.system)" }
          if ($rep.freecad.available) { throw 'unexpected: a hosted runner has no FreeCAD' }
          # @() around the property collection: on PowerShell 5.1 a bare `.Count` on a
          # PSCustomObject's Properties enumerates per-member instead of counting.
          $families = @($rep.solvers.families.PSObject.Properties).Count
          if ($families -lt 5) { throw "doctor reported only $families solver families" }
          Write-Host "doctor --json OK - $families families reported (doctor exit $doctorRc, expected nonzero)"
          # Actions ends a powershell step with `exit $LASTEXITCODE`, and the last native
          # command here is the doctor call that is SUPPOSED to exit nonzero. Without
          # this the step fails on the very exit code the assertions above just
          # certified as correct. Any throw above still fails the step ahead of it.
          exit 0

      - name: FreeCAD-free contracts (registry parity + Windows discovery)
        run: |
          $venv = "$env:RUNNER_TEMP\core-venv"
          & "$venv\Scripts\python.exe" tests\test_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'test_contracts failed' }
          & "$venv\Scripts\python.exe" tests\test_windows_support.py
          if ($LASTEXITCODE -ne 0) { throw 'test_windows_support failed' }
