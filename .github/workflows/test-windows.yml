name: Tests (Windows)

# Windows counterpart of test.yml. It runs the AnkusDrive suite on a SELF-HOSTED
# Windows runner that already has FreeCAD 1.1 installed (bundling ccx.exe + gmsh.exe,
# so structural FEM solves for real). This lane is deliberately its own thing rather
# than a reuse of test.yml because the Linux lane is bash + AppImage + a two-interpreter
# split that has no Windows meaning:
#
#   - Setup is tests/setup_local.ps1 (PowerShell): one .venv from `pip install -e .`,
#     no AppImage extraction, no PATH symlinks. FreeCAD is discovered by
#     ankusdrive/client.py under 'C:\Program Files\FreeCAD *\bin\freecadcmd.exe' and run
#     as a subprocess, so the driver interpreter never imports FreeCAD.
#   - The suite is tests/run_all.ps1, which skips the Linux-only external-solver
#     families (OpenFOAM / YADE / openEMS / bempp / preCICE — no native Windows build)
#     and runs the Windows-native FreeCAD-resolution contract (test_windows_support.py).
#
# This workflow pins `Windows` and test.yml/heavy-solves.yml pin `Linux` — otherwise a
# job could land on the wrong OS and run the other OS's shell scripts. The
# `Windows`/`Linux` labels are applied automatically by the Actions runner from the host
# OS. NOTE: unlike the Linux box, the Windows runner is registered WITHOUT the custom
# `ankusdrive` label, so requiring it here leaves the job queued forever (that is exactly
# how the first run of this lane died — 24 h in `queued`, then cancelled).
# `[self-hosted, Windows]` uniquely selects the one Windows box in this repo.
#
# A SECOND job, `core-install`, runs on GitHub-HOSTED windows-latest across a matrix of
# CPython versions (issue #279). It deliberately has no FreeCAD: its subject is the part
# of the install that a fresh user hits first and that the self-hosted box — with its
# one pre-provisioned interpreter and warm .venv — structurally cannot cover, namely
# "does `pip install -e .` resolve a WORKING dependency set on this Python, and does the
# MCP server then boot over stdio". That is exactly how #279 failed: a brand-new CPython
# 3.14, a resolver error nobody could attribute, and the MCP step never reached.
# Everything that needs real FreeCAD (`ankusdrive ping`, the solves) stays on the
# self-hosted job above, which also runs the same scripted installer end to end.

on:
  push:
    branches:
      - main
  pull_request:

# One run per ref needs the single self-hosted Windows box — supersede, don't queue.
concurrency:
  group: tests-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-windows:
    name: Test suite (FreeCAD 1.1, self-hosted Windows)
    runs-on: [self-hosted, Windows]
    # The Windows suite (no live external solves) is a few minutes; this only bounds a
    # wedged freecadcmd.exe worker so it can't hold the runner indefinitely.
    timeout-minutes: 30
    defaults:
      run:
        # Only Windows PowerShell 5.1 is guaranteed on the box (pwsh/Core is not
        # installed), so use `powershell`. The scripts are 5.1-compatible.
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Set up venv + FreeCAD-viable deps (no download; reuses installed FreeCAD)
        run: .\tests\setup_local.ps1

      - name: Sanity check — ankusdrive resolves FreeCAD
        run: |
          .\.venv\Scripts\python.exe -m ankusdrive doctor --no-boot
          # doctor exits nonzero if FreeCAD is unresolved -> the run fails fast here.

      - name: Run Windows test suite
        run: .\tests\run_all.ps1

      # The user-facing installer, end to end, on a box that HAS FreeCAD (#279). Into a
      # throwaway venv so the suite's own .venv above is untouched. It fails the step if
      # the MCP stdio handshake doesn't complete — the acceptance criterion of #279.
      - name: Scripted core install (scripts\install-core.ps1)
        run: |
          # Name the interpreter explicitly rather than leaning on the script's
          # auto-discovery: the Actions service runs as NETWORK SERVICE, whose PATH has
          # no per-user Python (that is how this lane first died). The suite's own venv
          # was already built from a working one, so reuse its base.
          # sys._base_executable, not base_prefix + '\python.exe': FreeCAD's bundled
          # interpreter (setup_local.ps1's last-resort choice) lives in bin\, so the
          # naive join would not exist.
          $base = & .\.venv\Scripts\python.exe -c 'import sys; print(sys._base_executable)'
          .\scripts\install-core.ps1 -Python "$base" -VenvDir "$env:RUNNER_TEMP\ankusdrive-core-venv"

      - name: Remove the throwaway core-install venv
        if: always()
        run: |
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\ankusdrive-core-venv" -ErrorAction SilentlyContinue
          exit 0

  core-install:
    name: Core install (hosted Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false          # a new CPython failing must not hide the others' status
      matrix:
        # Floor (pyproject's requires-python), the current stable, and the newest
        # release — the three answers to "what is the Python ceiling?" (#279). Keep the
        # top entry in step with the newest `Programming Language :: Python :: 3.x`
        # classifier; tests/test_windows_support.py pins that classifier to
        # install-core.ps1's $PY_MAX_VERIFIED.
        python-version: ["3.10", "3.13", "3.14"]
    defaults:
      run:
        # Windows PowerShell 5.1, not pwsh: that is what a stock Windows box has, so the
        # scripts must parse there. (The hosted image has both.)
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: ${{ matrix.python-version }}

      # -Python pins the matrix interpreter explicitly; the script's own auto-discovery
      # would otherwise pick whatever `py -3` resolves to on the image. No FreeCAD here,
      # so the script warns on that item and continues — but it still runs `pip install
      # -e .` with pyproject's pins, re-imports the resolved mcp/numpy/Pillow (catching a
      # #277-shaped bad resolve), and completes a real MCP stdio initialize + tools/list.
      - name: Scripted core install + MCP stdio boot
        run: >
          .\scripts\install-core.ps1
          -Python "${{ steps.py.outputs.python-path }}"
          -VenvDir "$env:RUNNER_TEMP\core-venv"

      - name: Entry point + doctor --json are well-formed without FreeCAD
        run: |
          $venv = "$env:RUNNER_TEMP\core-venv"
          # Collect the output FIRST, then test $LASTEXITCODE. Piping a native
          # command straight into `Select-Object -First N` makes PowerShell tear the
          # pipeline down as soon as N lines arrive, and the half-read process comes
          # back with a nonzero exit code -- so the pretty one-liner reports a broken
          # entry point on a `--help` that printed its usage perfectly well.
          $help = & "$venv\Scripts\ankusdrive.exe" --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'the ankusdrive.exe entry point does not run' }
          $help | Select-Object -First 3 | Write-Host
          # doctor exits nonzero here BY DESIGN (FreeCAD is unresolved on a hosted
          # runner), so gate on the report's shape, not the exit code.
          $json = & "$venv\Scripts\python.exe" -m ankusdrive doctor --json 2>$null | Out-String
          $rep = $json | ConvertFrom-Json
          if ($rep.platform.system -ne 'Windows') { throw "doctor reports $($rep.platform.system)" }
          if ($rep.freecad.available) { throw 'unexpected: a hosted runner has no FreeCAD' }
          # @() around the property collection: on PowerShell 5.1 a bare `.Count` on a
          # PSCustomObject's Properties enumerates per-member instead of counting.
          $families = @($rep.solvers.families.PSObject.Properties).Count
          if ($families -lt 5) { throw "doctor reported only $families solver families" }
          Write-Host "doctor --json OK - $families families reported"

      - name: FreeCAD-free contracts (registry parity + Windows discovery)
        run: |
          $venv = "$env:RUNNER_TEMP\core-venv"
          & "$venv\Scripts\python.exe" tests\test_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'test_contracts failed' }
          & "$venv\Scripts\python.exe" tests\test_windows_support.py
          if ($LASTEXITCODE -ne 0) { throw 'test_windows_support failed' }
