name: Publish to PyPI

# Builds the wheel + sdist on tag push, validates metadata, and publishes
# to PyPI (or TestPyPI on manual dispatch) using OIDC trusted publishing —
# no long-lived API tokens stored in the repo.
#
# One-time setup (outside this workflow):
#   1. Reserve the `ankusdrive` name on PyPI and TestPyPI by registering the
#      project (https://pypi.org/manage/account/publishing/).
#   2. Add a "Trusted publisher" entry on each, pointing at:
#        owner: gchen19
#        repo:  AnkusDrive
#        workflow filename: publish.yml
#        environment: pypi  (and `testpypi` for the test repo)
#   3. Create matching GitHub environments (`pypi`, `testpypi`) under
#      Settings → Environments. Add required reviewers if you want a
#      manual gate before each upload.
#
# Releasing:
#   - Normally: merge the release PR from scripts/prepare_release.py. Then
#     release-tag.yml tags vX.Y.Z and dispatches this workflow on the tag with
#     target=pypi. A tag pushed with the workflow token cannot trigger `push` here.
#   - By hand, still supported: push a `vX.Y.Z` tag that matches __version__.
#   - Either way the real PyPI upload runs only on a v* tag ref (checked below),
#     then the MCP Registry listing and the MCPB release.
#   - Run the workflow manually with target=testpypi to dry-run against
#     TestPyPI without cutting a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Real PyPI only from a release tag
        # A dispatch with target=pypi from a branch would burn a PyPI version that
        # has no tag, no verified version match and no GitHub release to attach to.
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::target=pypi must run on a v* tag (gh workflow run publish.yml --ref vX.Y.Z -f target=pypi), not ${GITHUB_REF}"
          exit 1

      - name: Verify tag matches package version
        # Version lives in ankusdrive/__init__.py (pyproject.toml reads it via
        # setuptools dynamic). Grep the line directly so we don't need to
        # import ankusdrive (which would require installing dependencies).
        # Keyed on the ref, not the event: release-tag.yml dispatches on the tag.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkgver=$(grep -E '^__version__\s*=' ankusdrive/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag" != "$pkgver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=> $tag) does not match ankusdrive/__init__.py __version__ $pkgver"
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test the wheel (no FreeCAD required)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          # CLI parser builds and entry point resolves without importing
          # the MCP server or booting a worker.
          /tmp/smoke/bin/ankusdrive --help > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ankusdrive/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ankusdrive/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-mcp-registry:
    # Lists the release on the official MCP Registry as io.github.gchen19/ankusdrive
    # (#201). Runs only after PyPI has the release: the registry verifies the
    # package exists at server.json's version and that its uploaded README carries
    # the `mcp-name:` token. tests/test_mcp_registry.py holds server.json's version
    # to __version__ in the fast lane, so a mismatch fails the release PR, not here.
    # Auth is GitHub OIDC — the io.github.gchen19/* namespace is granted to this
    # repo's workflows, no stored token.
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Pinned + checksum-verified, same policy as gitleaks: `latest` would run
      # whatever the registry repo shipped last with an OIDC token in scope.
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        run: |
          tarball="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${tarball}"
          echo "${MCP_PUBLISHER_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" mcp-publisher

      - name: Log in (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        # PyPI's JSON API can trail the upload by a minute or two, and the
        # registry's package check reads it — retry rather than fail a release
        # whose PyPI half already landed.
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish server.json && exit 0
            echo "::warning::registry publish attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::MCP Registry publish failed after 5 attempts. PyPI already has this release; re-run this job once the cause is fixed."
          exit 1

  release-mcpb:
    # Builds the MCPB bundle (#201) and attaches it to the GitHub release — the
    # one-click Claude Desktop install and the file Smithery distributes. Runs after
    # PyPI because mcpb/pyproject.toml pins ankusdrive==<version>, which only
    # resolves once the upload exists. tests/test_mcpb_bundle.py holds the pin and
    # manifest version to __version__ in the fast lane.
    #
    # Creates the release from this version's CHANGELOG section when it does not
    # exist yet (the changelog is the source, the release page a copy), and only
    # replaces the asset when it does — so a hand-created release keeps its notes.
    name: Release MCPB bundle
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the bundle
        # ubuntu-latest ships node/npx; the packer version is pinned in the script.
        run: scripts/build-mcpb.sh dist

      - name: Create or update the GitHub release
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' ankusdrive/__init__.py)"
          tag="v${version}"
          asset="dist/ankusdrive-${version}.mcpb"
          # Hash from inside dist/ so the checksum line names the bare filename:
          # `sha256sum -c` run beside a downloaded asset must find it (0.5.3's said
          # `dist/ankusdrive-0.5.3.mcpb` and failed to verify).
          (cd dist && sha256sum "ankusdrive-${version}.mcpb" | tee "ankusdrive-${version}.mcpb.sha256")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "${asset}.sha256" --clobber
          else
            awk -v v="$version" '
              index($0, "## [" v "]") == 1 { f = 1; next }
              f && /^## \[/ { exit }
              f' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "::error::CHANGELOG.md has no ## [${version}] section to use as release notes"
              exit 1
            fi
            gh release create "$tag" "$asset" "${asset}.sha256" \
              --verify-tag --title "${version}" --notes-file notes.md
            echo "::notice::Created ${tag} titled '${version}' — add the descriptive half of the title by hand if wanted."
          fi
