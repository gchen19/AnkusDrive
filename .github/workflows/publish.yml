name: Publish to PyPI

# Builds the wheel + sdist on tag push, validates metadata, and publishes
# to PyPI (or TestPyPI on manual dispatch) using OIDC trusted publishing —
# no long-lived API tokens stored in the repo.
#
# One-time setup (outside this workflow):
#   1. Reserve the `ankusdrive` name on PyPI and TestPyPI by registering the
#      project (https://pypi.org/manage/account/publishing/).
#   2. Add a "Trusted publisher" entry on each, pointing at:
#        owner: gchen19
#        repo:  AnkusDrive
#        workflow filename: publish.yml
#        environment: pypi  (and `testpypi` for the test repo)
#   3. Create matching GitHub environments (`pypi`, `testpypi`) under
#      Settings → Environments. Add required reviewers if you want a
#      manual gate before each upload.
#
# Releasing:
#   - Tag `vX.Y.Z` matching the version in pyproject.toml and push the tag.
#     Tag push triggers the real PyPI upload.
#   - Or run the workflow manually with target=testpypi to dry-run against
#     TestPyPI without cutting a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        # Version lives in ankusdrive/__init__.py (pyproject.toml reads it via
        # setuptools dynamic). Grep the line directly so we don't need to
        # import ankusdrive (which would require installing dependencies).
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkgver=$(grep -E '^__version__\s*=' ankusdrive/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag" != "$pkgver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=> $tag) does not match ankusdrive/__init__.py __version__ $pkgver"
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test the wheel (no FreeCAD required)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          # CLI parser builds and entry point resolves without importing
          # the MCP server or booting a worker.
          /tmp/smoke/bin/ankusdrive --help > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ankusdrive/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ankusdrive/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
