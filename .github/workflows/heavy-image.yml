name: Heavy-solver image

# Builds ghcr.io/<owner>/ankusdrive-heavy — every external solver the Linux
# heavy-solves lanes run live, prebuilt (#339), for linux/amd64 AND linux/arm64 (#363).
# Recipe and pins: docker/heavy-solvers/Dockerfile.
#
# SHAPE. Per architecture, on a NATIVE runner (ubuntu-latest / ubuntu-24.04-arm — no
# QEMU emulation, which would multiply these compile times): one job builds the shared
# `system` stage, four parallel jobs build one source stage each (YADE, openEMS, the
# preCICE FSI stack, OpenFOAM-7 + openInjMoldSim), and a final job assembles that
# architecture's image. Every job reads and writes a per-stage, per-arch registry
# cache, so a run that changes one stage recompiles only that stage. On main, each
# architecture is pushed by digest and a last job joins them into one multi-arch
# manifest carrying the tags — `docker pull` then picks the right platform.
#
# The image is not pushed unless its own last build step passes on that architecture:
# scripts/ci-linux-preflight.sh, which fails if any heavy solver does not resolve —
# apart from what that architecture's image explicitly excludes (Blender on arm64: no
# build exists), which it reports instead.
#
# TRIGGERS. A push to main touching the recipe; a PR touching it (built, never
# pushed); on demand; and monthly, because the apt layers (ESI OpenFOAM, the Elmer
# PPA) float and a drift should surface here rather than inside a heavy-solves run.
# heavy-solves.yml pins the image by digest, so a rebuild never changes what those
# lanes test until the pin is bumped.

on:
  push:
    branches: [main]
    paths:
      - "docker/heavy-solvers/**"
      - ".dockerignore"
      - "scripts/install-solvers.sh"
      - "scripts/install-freecad-appimage.sh"
      - "scripts/install-renderers.sh"
      - "scripts/ci-linux-preflight.sh"
      - "tools/build_openinjmoldsim.sh"
      - "ankusdrive/solvers.py"
      - ".github/workflows/heavy-image.yml"
  pull_request:
    paths:
      - "docker/heavy-solvers/**"
      - ".dockerignore"
      - "scripts/install-solvers.sh"
      - "scripts/install-freecad-appimage.sh"
      - "scripts/install-renderers.sh"
      - "scripts/ci-linux-preflight.sh"
      - "tools/build_openinjmoldsim.sh"
      - "ankusdrive/solvers.py"
      - ".github/workflows/heavy-image.yml"
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st — apt/PPA drift guard

concurrency:
  group: heavy-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ankusdrive-heavy
  # The slim runtime image users pull for ANKUSDRIVE_SUBSTRATE=container (#422). Built
  # from the SAME source stages, so it can never drift from the recipe the heavy image
  # is built from.
  SLIM_IMAGE: ghcr.io/${{ github.repository_owner }}/ankusdrive-solvers
  # Fork PRs get a read-only token: they read the cache but cannot write it.
  CAN_WRITE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  system:
    name: Build stage — system (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/heavy-solvers/Dockerfile
          target: system
          platforms: linux/${{ matrix.platform.arch }}
          push: false
          # the unsuffixed refs are the pre-multi-arch (amd64) caches: read-only fallback
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:cache-system-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-system
          cache-to: ${{ env.CAN_WRITE == 'true' && format('type=registry,ref={0}:cache-system-{1},mode=max', env.IMAGE, matrix.platform.arch) || '' }}

  stage:
    name: Build stage — ${{ matrix.target }} (${{ matrix.platform.arch }})
    needs: system
    runs-on: ${{ matrix.platform.runner }}
    # A hosted runner has 4 cores; OpenFOAM-7 is the long pole.
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
        target: [yade, openems, fsi, oims, elmer, bempp]
    steps:
      # The OpenFOAM-7 tree and YADE's objects need more than the image's default
      # free space; these preinstalled toolchains are unused here (absent paths on
      # the arm64 image are simply skipped by rm -f).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/heavy-solvers/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: JOBS=4
          push: false
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:cache-system-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.target }}-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-system
            type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.target }}
          cache-to: ${{ env.CAN_WRITE == 'true' && format('type=registry,ref={0}:cache-{1}-{2},mode=max', env.IMAGE, matrix.target, matrix.platform.arch) || '' }}

  image:
    name: Assemble + preflight (${{ matrix.platform.arch }})
    needs: stage
    runs-on: ${{ matrix.platform.runner }}
    # Usually minutes: the source stages are already built and this only assembles
    # them, installs FreeCAD and runs the preflight. But a commit that invalidates the
    # `system` layer invalidates EVERY stage, and this job then rebuilds what it
    # cannot pull — amd64 hit the old 120-minute cap doing exactly that (#423), which
    # skipped the publish for an image that was otherwise fine. The cap is a runaway
    # guard, not a schedule; a hosted runner's own ceiling is 6 hours.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/heavy-solvers/Dockerfile
          target: final
          platforms: linux/${{ matrix.platform.arch }}
          # Never from a PR. On main each arch is pushed untagged, by digest; the
          # `manifest` job below joins them under the tags.
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:cache-system-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-yade-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-openems-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-fsi-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-oims-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-elmer-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-final-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-system
            type=registry,ref=${{ env.IMAGE }}:cache-yade
            type=registry,ref=${{ env.IMAGE }}:cache-openems
            type=registry,ref=${{ env.IMAGE }}:cache-fsi
            type=registry,ref=${{ env.IMAGE }}:cache-oims
            type=registry,ref=${{ env.IMAGE }}:cache-final
          cache-to: ${{ env.CAN_WRITE == 'true' && format('type=registry,ref={0}:cache-final-{1},mode=max', env.IMAGE, matrix.platform.arch) || '' }}
      - name: Record this architecture's digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-arch manifest
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Sigstore signs with a short-lived OIDC identity; the attestation is then
      # written to this repo and pushed beside the image (#423).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha,format=short
      - name: Join the per-arch digests under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          n=$(ls | wc -l)
          [ "$n" -eq 2 ] || { echo "expected 2 architecture digests, got $n" >&2; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Record the digest to pin
        id: pin
        run: |
          ref="$IMAGE:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### ankusdrive-heavy (linux/amd64 + linux/arm64)"
            echo "Pin in heavy-solves.yml: \`$IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PIN $IMAGE@$digest"
      # WHAT SIGNS THIS IMAGE (#423). `docker pull` trusts whatever the registry
      # serves; a digest pin proves only that two people got the same bytes, not who
      # built them. These attestations tie THIS digest to this repository, this
      # workflow file and this commit, signed through Sigstore with a short-lived
      # OIDC identity — no key to store or leak. Users verify with
      # `scripts/verify-container-image.sh` (a `gh attestation verify` wrapper).
      #
      # The subject is the multi-arch MANIFEST digest, which is what a tag resolves
      # to and therefore what anyone actually pulls.
      - name: Attest build provenance (heavy)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.pin.outputs.digest }}
          push-to-registry: true
      # An SBOM turns "is it authentic?" into "what is in it?" — the question that
      # matters when a CVE lands in one of the bundled solvers' dependencies.
      #
      # CycloneDX, not SPDX: GitHub caps an attestation predicate at 16 MiB, and SPDX
      # carries an entry per packaged FILE — measured on the slim image, 18.7 MiB of
      # which 22,721 entries were files and only 610 were packages. CycloneDX records
      # those same 610 packages in 7.8 MiB. The first signing run failed exactly here,
      # on BOTH images.
      - name: Generate SBOM (heavy)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.pin.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      # Size follows the image's contents, so it can cross the cap again as solvers are
      # added. An SBOM that does not fit must not sink the publish: the signed image is
      # what users need, and it is already pushed by here. Too big means keep it as an
      # artifact and say so — never fail.
      - name: Can this SBOM be attested? (heavy)
        id: sbomfit
        run: |
          bytes=$(stat -c %s sbom.cdx.json)
          limit=$((16 * 1024 * 1024))
          echo "SBOM (heavy): $((bytes / 1048576)) MiB (cap $((limit / 1048576)) MiB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -lt "$limit" ]; then
            echo "fits=true" >> "$GITHUB_OUTPUT"
          else
            echo "fits=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SBOM is $((bytes / 1048576)) MiB, over GitHub's 16 MiB attestation cap — kept as an artifact instead"
          fi
      - name: Attest SBOM (heavy)
        if: steps.sbomfit.outputs.fits == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.pin.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      # Kept either way: when it did not fit, this is the only copy.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-heavy
          path: sbom.cdx.json
          retention-days: 90


  slim:
    name: Slim solver image (${{ matrix.platform.arch }})
    # The same source stages the heavy image assembles, minus FreeCAD, the driver venv
    # and every -dev package: what a user actually runs under the container substrate
    # (#422). It builds from the stage caches, so it adds minutes, not another compile.
    needs: stage
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/heavy-solvers/Dockerfile
          target: slim
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            BUILT_SOURCE=published
            BUILT_COMMIT=${{ github.sha }}
            BUILT_WORKFLOW=.github/workflows/heavy-image.yml
          # The slim stage's own RUN steps are the gate: every solver's DT_NEEDED must
          # resolve (tools/container_runtime_deps.sh --check, so the trimmed package
          # list is complete on THIS arch) and every solver must actually run. A PR
          # builds without pushing; main pushes by digest for the manifest below.
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.SLIM_IMAGE) || 'type=cacheonly' }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:cache-system-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-yade-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-openems-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-fsi-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-oims-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-elmer-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE }}:cache-bempp-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.SLIM_IMAGE }}:cache-slim-${{ matrix.platform.arch }}
          cache-to: ${{ env.CAN_WRITE == 'true' && format('type=registry,ref={0}:cache-slim-{1},mode=max', env.SLIM_IMAGE, matrix.platform.arch) || '' }}
      - name: Report the size a user downloads
        run: |
          docker buildx imagetools inspect "${{ env.SLIM_IMAGE }}@${{ steps.build.outputs.digest }}" \
            --format '{{json .Manifest}}' 2>/dev/null \
            | jq -r '"compressed layers: \(([.layers[].size] | add) / 1000000 | floor) MB"' \
            >> "$GITHUB_STEP_SUMMARY" || echo "(not pushed on a PR)" >> "$GITHUB_STEP_SUMMARY"
        if: github.event_name != 'pull_request'
      - name: Record this architecture's digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slim-digest-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  slim-subset:
    name: Slim subset build — openfoam only (amd64)
    # Proves the SELECTION works (#422 part B), which the full build cannot: with one
    # solver chosen, the other six must be absent from the image AND recorded as
    # excluded in its manifest, so the host reports them honestly instead of "ready".
    # amd64 only: the mechanism is arch-independent and this is a fast guard, not a
    # second product.
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/heavy-solvers/Dockerfile
          target: slim
          platforms: linux/amd64
          build-args: |
            WITH_OPENFOAM=on
            WITH_ELMER=off
            WITH_YADE=off
            WITH_OPENEMS=off
            WITH_FSI=off
            WITH_OIMS=off
            WITH_BEMPP=off
          load: true
          tags: ankusdrive-solvers:subset
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:cache-system-amd64
            type=registry,ref=${{ env.SLIM_IMAGE }}:cache-slim-amd64
      - name: The image carries only what was selected, and says so
        run: |
          set -euo pipefail
          docker run --rm ankusdrive-solvers:subset cat /etc/ankusdrive/solvers.json | tee manifest.json
          python3 - <<'PY'
          import json
          m = json.load(open("manifest.json"))
          assert sorted(m["solvers"]) == ["openfoam"], m["solvers"]
          assert sorted(m["excluded"]) == ["bempp", "elmer", "fsi", "oims", "openems", "yade"], m["excluded"]
          PY
          # the unselected solvers' files must genuinely be absent, not merely unlisted
          for p in /opt/yade/bin/yade /opt/venv-bempp/bin/python /opt/venv-openems/bin/python; do
            if docker run --rm ankusdrive-solvers:subset test -e "$p"; then
              echo "::error::$p is in an image that excluded it"; exit 1
            fi
          done
          docker run --rm ankusdrive-solvers:subset bash -c \
            'source "$ANKUSDRIVE_OPENFOAM_BASHRC" >/dev/null 2>&1; simpleFoam -help >/dev/null'
          full=$(docker run --rm ankusdrive-solvers:subset du -sx --exclude=/proc --exclude=/sys / | cut -f1)
          echo "subset filesystem: $((full / 1024)) MB" >> "$GITHUB_STEP_SUMMARY"

  slim-manifest:
    name: Publish slim multi-arch manifest
    needs: slim
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Sigstore signs with a short-lived OIDC identity; the attestation is then
      # written to this repo and pushed beside the image (#423).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: slim-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.SLIM_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha,format=short
      - name: Join the per-arch digests under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          n=$(ls | wc -l)
          [ "$n" -eq 2 ] || { echo "expected 2 architecture digests, got $n" >&2; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$SLIM_IMAGE@sha256:%s " *)
      - name: Record the digest to pin
        id: pin
        run: |
          ref="$SLIM_IMAGE:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### ankusdrive-solvers — slim, for ANKUSDRIVE_SUBSTRATE=container (linux/amd64 + linux/arm64)"
            echo "Pin in docs/CONTAINER_SUBSTRATE.md: \`$SLIM_IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PIN $SLIM_IMAGE@$digest"
      # WHAT SIGNS THIS IMAGE (#423). `docker pull` trusts whatever the registry
      # serves; a digest pin proves only that two people got the same bytes, not who
      # built them. These attestations tie THIS digest to this repository, this
      # workflow file and this commit, signed through Sigstore with a short-lived
      # OIDC identity — no key to store or leak. Users verify with
      # `scripts/verify-container-image.sh` (a `gh attestation verify` wrapper).
      #
      # The subject is the multi-arch MANIFEST digest, which is what a tag resolves
      # to and therefore what anyone actually pulls.
      - name: Attest build provenance (slim)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.SLIM_IMAGE }}
          subject-digest: ${{ steps.pin.outputs.digest }}
          push-to-registry: true
      # An SBOM turns "is it authentic?" into "what is in it?" — the question that
      # matters when a CVE lands in one of the bundled solvers' dependencies.
      #
      # CycloneDX, not SPDX: GitHub caps an attestation predicate at 16 MiB, and SPDX
      # carries an entry per packaged FILE — measured on the slim image, 18.7 MiB of
      # which 22,721 entries were files and only 610 were packages. CycloneDX records
      # those same 610 packages in 7.8 MiB. The first signing run failed exactly here,
      # on BOTH images.
      - name: Generate SBOM (slim)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.SLIM_IMAGE }}@${{ steps.pin.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      # Size follows the image's contents, so it can cross the cap again as solvers are
      # added. An SBOM that does not fit must not sink the publish: the signed image is
      # what users need, and it is already pushed by here. Too big means keep it as an
      # artifact and say so — never fail.
      - name: Can this SBOM be attested? (slim)
        id: sbomfit
        run: |
          bytes=$(stat -c %s sbom.cdx.json)
          limit=$((16 * 1024 * 1024))
          echo "SBOM (slim): $((bytes / 1048576)) MiB (cap $((limit / 1048576)) MiB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -lt "$limit" ]; then
            echo "fits=true" >> "$GITHUB_OUTPUT"
          else
            echo "fits=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SBOM is $((bytes / 1048576)) MiB, over GitHub's 16 MiB attestation cap — kept as an artifact instead"
          fi
      - name: Attest SBOM (slim)
        if: steps.sbomfit.outputs.fits == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.SLIM_IMAGE }}
          subject-digest: ${{ steps.pin.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      # Kept either way: when it did not fit, this is the only copy.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-slim
          path: sbom.cdx.json
          retention-days: 90

