name: Fast checks

# A FreeCAD-free "fast lane" that runs on stock GitHub-hosted runners in
# seconds, complementing the heavyweight self-hosted suite in test.yml. It
# catches the failure modes of this codebase's two parallel command registries
# (worker @handler <-> mcp @mcp.tool) plus syntax/import errors and stub
# docstrings — so PRs get signal even when the self-hosted FreeCAD box is busy
# or offline. None of these steps import FreeCAD.

on:
  push:
    branches:
      - main
  pull_request:

# A new push to a PR cancels the previous (still-running) fast-checks run.
concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Lint + contracts (no FreeCAD)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff + a PEP 517 build frontend
        # `build` backs the packaging suite below. Without it that test degrades to
        # a SKIP (by design, for dev machines) and this lane would silently stop
        # covering the wheel — the exact blind spot #249 is about.
        # setuptools is pinned above pyproject's build-system floor too: the runner
        # image ships an older one, and the packaging test refuses to build with a
        # backend too old to honour the config (it would report a false failure).
        run: pip install "ruff==0.15.15" build "setuptools>=77" wheel

      - name: Ruff (syntax + pyflakes, config in pyproject.toml)
        run: ruff check ankusdrive tests

      - name: Byte-compile every module (catches syntax/indent errors)
        run: python -m compileall -q ankusdrive tests

      - name: Registry parity + docstring contracts
        run: python tests/test_contracts.py

      - name: Naming — the pre-rename name stays gone (#295)
        # Sweeps every tracked file and path for the old project name against a
        # self-validating allowlist, so a pre-rename branch cannot merge a second
        # name for one thing back in unnoticed.
        run: python tests/test_naming.py

      - name: Rename compatibility shims — legacy env / config / DP_* props (#295)
        # Each shim keeps a <=0.4.x install working and each fails silently if it
        # regresses. Delete this step with the shims in 0.6.
        run: python tests/test_compat_rename.py

      - name: Packaging — built wheel/sdist carries every runtime corpus (#249)
        # Builds a real distribution into a temp dir, re-derives the expected data
        # files from the loaders, and rebuilds once with a trimmed package-data to
        # prove the assertion can fail. Seconds, no FreeCAD, no network.
        run: python tests/test_package_data.py
