name: Tests

# Run the DriftPin test suite on every push to main and every PR. Gates the
# publish.yml release path — tagging from a non-green commit shouldn't ship.
#
# FreeCAD comes from conda-forge so we get 1.1.x reliably; Ubuntu apt lags
# well behind. The same env supplies Pillow/numpy, so the two-interpreter
# split in tests/run_all.sh (system python3 for FreeCAD-loading tests, .venv
# for tests needing Pillow+numpy) collapses to one env — we symlink the
# conda env's bin/ as .venv/bin so both paths resolve to the same Python.
#
# Perf and reliability suites are gated behind env vars in run_all.sh and
# intentionally NOT run here (perf is noisy on CI runners, reliability costs
# Anthropic API credits).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test suite (FreeCAD 1.1 via conda-forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}  # -e for fail-fast, -l so micromamba activate works
    steps:
      - uses: actions/checkout@v4

      - name: Install FreeCAD + Python deps via micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: driftpin
          create-args: >-
            python=3.11
            freecad=1.1.*
            pillow
            numpy
          cache-environment: true
          init-shell: bash

      - name: Symlink conda env as .venv (so tests/run_all.sh finds VENV_PY)
        run: |
          mkdir -p .venv
          ln -sfn "$CONDA_PREFIX/bin" .venv/bin

      - name: Sanity check — FreeCAD + freecadcmd reachable
        run: |
          python -c "import FreeCAD; print('FreeCAD', FreeCAD.Version())"
          which freecadcmd
          freecadcmd --version 2>&1 | head -1 || true

      - name: Run test suite
        run: bash tests/run_all.sh
