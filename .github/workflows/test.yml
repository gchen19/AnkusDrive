name: Tests

# Run the AnkusDrive test suite on every push to main and every PR — on a
# SELF-HOSTED runner. This project's test CI does NOT use GitHub-hosted
# runners; it runs on a machine that already has FreeCAD 1.1 installed.
#
# Because FreeCAD is already present, we don't download it via conda. Instead
# tests/setup_local.sh reuses the installed AppImage: it puts `freecadcmd` on
# PATH (so ankusdrive's worker resolves it via shutil.which) and points
# .venv/bin/python3 at FreeCAD's bundled python, which already ships numpy +
# Pillow. That feeds run_all.sh's two-interpreter split (system python3 for
# the worker tests, .venv python3 for the numpy/Pillow tests).
#
# Perf and reliability suites are gated behind env vars in run_all.sh and
# intentionally NOT run here (perf is noisy, reliability costs Anthropic
# API credits). The CPU-intensive LIVE external-solver solves (OpenFOAM,
# standalone Elmer, openEMS, Bempp, YADE, preCICE FSI, CalculiX warpage,
# openInjMoldSim molding — minutes each, some flaky under load) are likewise
# gated OFF here behind RUN_HEAVY_SOLVES (tests/heavy_solve.py) — they would blow
# the 20-min cap below — and run in the dedicated heavy-solves.yml only when a
# change touches solver/analysis code, on demand, or nightly. The cheap
# analytic-oracle / case-structure halves of those test files still run here.

on:
  push:
    branches:
      - main
  pull_request:

# Only one run per ref needs the single self-hosted FreeCAD box — a new push to
# a branch cancels the superseded run instead of queueing behind it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test suite (FreeCAD 1.1, self-hosted)
    # Fork guard (do not remove before this repo is public — see the header).
    # A bare `pull_request:` trigger runs the FORK's code, and this job runs on a
    # persistent machine that is somebody's actual computer: its $HOME, its keys,
    # its network. On a public repo that is arbitrary code execution by anyone who
    # can open a PR, which is why GitHub advises against self-hosted runners there.
    # Same-repo PRs and pushes still run; a fork PR skips this lane and is covered
    # by the hosted FreeCAD lane instead (.github/workflows/hosted-freecad.yml).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Pin `Linux`: this box's Windows sibling shares the `ankusdrive` label, and this job's
    # steps are bash + AppImage + a Linux two-interpreter split. The Windows suite is a
    # separate lane (.github/workflows/test-windows.yml). The OS label is auto-applied.
    runs-on: [self-hosted, ankusdrive, Linux]
    # The suite is ~1 min; this only bounds a wedged freecadcmd worker so it
    # can't hold the self-hosted runner indefinitely.
    timeout-minutes: 20
    steps:
      # A self-hosted job's logs go public with the repo, and tool paths under the
      # service user's home print into them (FreeCAD's Mod loader, checkout's
      # .gitconfig copy, solver discovery). Masking $HOME and the username FIRST —
      # before checkout, which is the first printer — redacts every later
      # occurrence to *** (#303).
      - name: Mask runner-local identity in logs
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::$(whoami)"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Wire local FreeCAD (no download; reuses installed AppImage)
        run: |
          bash tests/setup_local.sh
          # expose freecadcmd to subsequent steps
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sanity check — freecadcmd reachable
        run: |
          which freecadcmd
          freecadcmd --version 2>&1 | head -1 || true

      - name: Run test suite
        run: bash tests/run_all.sh
