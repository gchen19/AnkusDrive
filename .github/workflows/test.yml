name: Tests

# The full AnkusDrive suite on a GitHub-HOSTED runner — every push to main and
# every PR, fork PRs included. Converted from the self-hosted Linux box ahead of
# the public flip (#303): a hosted runner is always available, holds no home
# directory or keys, and makes the fork-PR arbitrary-code-execution class
# structurally impossible instead of trigger-guarded — no fork-skip `if`, no
# log masking, nothing for a future edit to get wrong. The live solver stack
# (OpenFOAM, openEMS, Bempp, YADE, preCICE FSI, ...) runs in heavy-solves.yml,
# also GitHub-hosted since #343, inside the prebuilt ankusdrive-heavy image.
#
# Provisioning mirrors hosted-freecad.yml — FreeCAD 1.1 + CalculiX from
# conda-forge on py3.11 (tests/test_worker.py asserts both; see that workflow's
# header for the version-bound rationale) — plus the suite's driver deps in the
# same env: `pip install -e .` brings mcp/numpy/Pillow, ruff is pinned to the
# fast-checks version, `build` feeds the packaging test.
#
# run_all.sh's two-interpreter split collapses here BY DESIGN: with no .venv in
# the tree it falls back to `python3` for everything, and this one conda env
# satisfies every suite's imports (the split exists for the AppImage layout,
# where the FreeCAD-bundled python and the system one each lack half the deps).
#
# Live external solves stay gated off (RUN_HEAVY_SOLVES unset). Solver families
# with no binary on this image SKIP their solve halves and still run their
# analytic-oracle / case-generation halves — the same contract as any partly
# provisioned machine (see CONTRIBUTING.md). Their real solves run nightly in
# heavy-solves.yml; Windows-native SU2/Elmer solves run in test-windows.yml,
# which provisions both via scripts/install-solvers.ps1.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}    # manual trigger to re-run on demand

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test suite (hosted FreeCAD 1.1)
    runs-on: ubuntu-latest
    # Conda solve + FreeCAD download is the long pole (~5 min observed on the
    # worker-suite lane); the suite itself is a few minutes. 30 bounds a wedged
    # freecadcmd worker without cutting a slow-mirror day.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env stays activated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Miniforge (conda-forge)
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: ankusdrive
          python-version: "3.11"

      - name: Install FreeCAD 1.1 + CalculiX + suite deps
        run: |
          # Same install as hosted-freecad.yml (see its header for why the
          # freecad bound is `<1.2` and how ccx resolves), plus the driver deps
          # the full suite needs beyond the worker subset.
          conda install -y "freecad>=1.1,<1.2" calculix
          python -m pip install -e . "ruff==0.15.15" build
          echo "--- freecadcmd ---"
          which freecadcmd
          freecadcmd --version 2>&1 | head -3 || true
          echo "ANKUSDRIVE_FREECADCMD=$(which freecadcmd)" >> "$GITHUB_ENV"

      - name: Run test suite
        run: bash tests/run_all.sh

  macos-dev-env:
    name: Discovery on a docs/MACOS.md dev Mac (hosted, no FreeCAD)
    # #314. The Linux lanes fake a Mac-with-Multipass by monkeypatching; three leaks in
    # a row (#313, #349, #314) got past that and only showed on a real developer Mac.
    # This builds that Mac on a hosted runner with nothing patched: tests/ci/multipass
    # on PATH answering `info` with a running VM, and the OpenFOAM override declared in
    # both the env and a config.toml, exactly as docs/MACOS.md sets them. The script
    # checks that premise first so the lane cannot go vacuously green. No VM (hosted
    # runners have no nested virtualization) and no FreeCAD, so it is minutes.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install AnkusDrive
        run: python -m pip install -e .

      - name: Discovery suites against the documented Multipass setup
        run: bash tests/run_macos_devenv.sh
